name: render
# Lives in the private bridge repo (see tools/remote/gh_render.py). A push to a job/* branch that contains bundle.zip renders the
# slide chapters with tools/remote/render_remote.py and uploads results.zip as a one-day artifact.
on:
  push:
    branches: ["job/**"]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # hyperframes@0.8.149 refuses Node < 22
      - name: unpack the bundle
        run: |
          mkdir work
          unzip -q bundle.zip -d work
      - name: system packages
        working-directory: work
        run: bash setup_linux.sh
      - name: render
        working-directory: work
        run: python3 render_remote.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            work/results.zip
            work/progress.log
          retention-days: 1
